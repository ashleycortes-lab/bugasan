/* Custom CSS and Thermal Receipt Styling for Bugasan System */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Libre+Barcode+39+Text&display=swap');

:root {
    --primary: #059669;
    --primary-dark: #047857;
    --accent: #d97706;
    --dark: #0f172a;
    --surface: #ffffff;
    --bg: #f8fafc;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f1f5f9;
    color: #1e293b;
    overflow-x: hidden;
}

/* Keycap styling for mouseless operation shortcuts */
kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
    border: 1px solid #cbd5e1;
    border-bottom: 2px solid #94a3b8;
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    color: #334155;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.shortcut-badge {
    position: relative;
    top: -1px;
}

/* Scrollbar beautifier */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: #f1f5f9;
}
::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

/* Thermal Paper Receipt Styling */
.thermal-receipt {
    font-family: 'Space Mono', monospace;
    background: #ffffff;
    color: #000000;
    width: 360px;
    margin: 0 auto;
    padding: 24px 20px 32px 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    position: relative;
    border: 1px dashed #cbd5e1;
    border-radius: 4px;
}

.thermal-receipt::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 0;
    right: 0;
    height: 8px;
    background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
    background-size: 16px 16px;
}

.receipt-barcode {
    font-family: 'Libre Barcode 39 Text', cursive;
    font-size: 38px;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1;
}

.dashed-divider {
    border-top: 1px dashed #475569;
    margin: 8px 0;
}

.double-divider {
    border-top: 2px double #1e293b;
    margin: 8px 0;
}

/* QR Code styling */
.qr-frame {
    background: white;
    padding: 16px;
    border-radius: 16px;
    border: 2px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    display: inline-block;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.animate-fade-in {
    animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Print Rules - Essential for Soft-Copy Receipt printing */
@media print {
    body * {
        visibility: hidden !important;
    }
    #printable-receipt-area, #printable-receipt-area * {
        visibility: visible !important;
    }
    #printable-receipt-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
    }
    .no-print {
        display: none !important;
    }
}

    <script>
window.SUPABASE_SCHEMA_SQL = "-- ============================================================================\n-- BUGASAN POS & COMPUTER ACCOUNTING SYSTEM - SUPABASE DATABASE SCHEMA\n-- Compatible with Supabase PostgreSQL (REST API & RLS)\n-- Project: https://tagnuihzrbjxhqmzhduc.supabase.co\n-- ============================================================================\n\n-- 1. Enable UUID Extension\nCREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\n\n-- 2. USERS TABLE\nCREATE TABLE IF NOT EXISTS public.users (\n    id BIGSERIAL PRIMARY KEY,\n    user_id INT UNIQUE,\n    email TEXT UNIQUE NOT NULL,\n    password TEXT NOT NULL,\n    role_id INT NOT NULL DEFAULT 3, -- 1: Admin, 2: Manager, 3: Cashier\n    first_name TEXT NOT NULL,\n    middle_name TEXT DEFAULT '',\n    last_name TEXT NOT NULL,\n    phone_number TEXT DEFAULT '',\n    address TEXT DEFAULT '',\n    status TEXT DEFAULT 'Active',\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 3. SUPPLIERS TABLE\nCREATE TABLE IF NOT EXISTS public.suppliers (\n    id BIGSERIAL PRIMARY KEY,\n    name TEXT NOT NULL,\n    contact_person TEXT,\n    phone TEXT,\n    email TEXT,\n    address TEXT,\n    supplied_varieties TEXT,\n    status TEXT DEFAULT 'Active',\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 4. PRODUCTS (RICE INVENTORY) TABLE\nCREATE TABLE IF NOT EXISTS public.products (\n    id BIGSERIAL PRIMARY KEY,\n    barcode TEXT UNIQUE NOT NULL,\n    name TEXT NOT NULL,\n    category TEXT DEFAULT 'Regular', -- Premium, Regular, Specialty, Glutinous\n    unit TEXT DEFAULT '50kg sack',   -- 'kg', '25kg sack', '50kg sack'\n    cost_price NUMERIC(12,2) NOT NULL DEFAULT 0,\n    selling_price NUMERIC(12,2) NOT NULL DEFAULT 0,\n    stock_quantity NUMERIC(12,2) NOT NULL DEFAULT 0,\n    min_threshold NUMERIC(12,2) NOT NULL DEFAULT 10,\n    supplier_id BIGINT REFERENCES public.suppliers(id) ON DELETE SET NULL,\n    supplier_name TEXT DEFAULT '',\n    harvest_batch TEXT DEFAULT '',\n    expiry_date DATE,\n    status TEXT DEFAULT 'In Stock',\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 5. TRANSACTIONS / SALES TABLE\nCREATE TABLE IF NOT EXISTS public.transactions (\n    id BIGSERIAL PRIMARY KEY,\n    invoice_no TEXT UNIQUE NOT NULL,\n    cashier_id INT,\n    cashier_name TEXT NOT NULL,\n    items JSONB NOT NULL DEFAULT '[]'::jsonb,\n    subtotal NUMERIC(12,2) NOT NULL DEFAULT 0,\n    tax_rate NUMERIC(5,2) NOT NULL DEFAULT 12,\n    tax_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\n    discount_type TEXT DEFAULT 'None', -- 'None', 'Senior Citizen', 'PWD'\n    discount_id TEXT DEFAULT '',\n    discount_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\n    total_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\n    payment_method TEXT NOT NULL DEFAULT 'Cash', -- 'Cash', 'GCash', 'Maya', 'MariBank'\n    payment_reference TEXT DEFAULT '',\n    amount_tendered NUMERIC(12,2) NOT NULL DEFAULT 0,\n    change_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\n    status TEXT DEFAULT 'Completed', -- 'Completed', 'Voided'\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 6. RESTOCK HISTORY TABLE\nCREATE TABLE IF NOT EXISTS public.restock_history (\n    id BIGSERIAL PRIMARY KEY,\n    product_id BIGINT REFERENCES public.products(id) ON DELETE CASCADE,\n    product_name TEXT NOT NULL,\n    barcode TEXT NOT NULL,\n    quantity NUMERIC(12,2) NOT NULL,\n    unit TEXT NOT NULL,\n    supplier_id BIGINT,\n    supplier_name TEXT,\n    cost_per_unit NUMERIC(12,2),\n    total_cost NUMERIC(12,2),\n    restocked_by TEXT,\n    notes TEXT,\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 7. EMPLOYEES & PAYROLL TABLE\nCREATE TABLE IF NOT EXISTS public.employees (\n    id BIGSERIAL PRIMARY KEY,\n    name TEXT NOT NULL,\n    role TEXT NOT NULL,\n    daily_rate NUMERIC(10,2) NOT NULL DEFAULT 0,\n    days_worked NUMERIC(5,1) NOT NULL DEFAULT 0,\n    overtime_hours NUMERIC(5,1) NOT NULL DEFAULT 0,\n    sss_deduction NUMERIC(10,2) NOT NULL DEFAULT 0,\n    philhealth_deduction NUMERIC(10,2) NOT NULL DEFAULT 0,\n    pagibig_deduction NUMERIC(10,2) NOT NULL DEFAULT 0,\n    other_deductions NUMERIC(10,2) NOT NULL DEFAULT 0,\n    gross_pay NUMERIC(12,2) NOT NULL DEFAULT 0,\n    net_pay NUMERIC(12,2) NOT NULL DEFAULT 0,\n    period TEXT DEFAULT 'Current Cutoff',\n    status TEXT DEFAULT 'Active',\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 8. LOSSES & SPOILAGE TABLE\nCREATE TABLE IF NOT EXISTS public.losses (\n    id BIGSERIAL PRIMARY KEY,\n    product_id BIGINT REFERENCES public.products(id) ON DELETE SET NULL,\n    product_name TEXT NOT NULL,\n    quantity NUMERIC(12,2) NOT NULL,\n    unit TEXT NOT NULL,\n    reason TEXT NOT NULL, -- 'Damaged Sack', 'Pest/Weevil Infestation', 'Moisture Spoilage', 'Spillage'\n    cost_loss NUMERIC(12,2) NOT NULL DEFAULT 0,\n    logged_by TEXT,\n    notes TEXT,\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 9. SYSTEM AUDIT LOGS TABLE\nCREATE TABLE IF NOT EXISTS public.system_logs (\n    id BIGSERIAL PRIMARY KEY,\n    user_name TEXT NOT NULL,\n    user_role TEXT NOT NULL,\n    action TEXT NOT NULL, -- 'LOGIN', 'SALE', 'VOID_TRANSACTION', 'RESTOCK', 'USER_UPDATE', etc.\n    details TEXT NOT NULL,\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- 10. SYSTEM SETTINGS TABLE\nCREATE TABLE IF NOT EXISTS public.settings (\n    key TEXT PRIMARY KEY,\n    value TEXT NOT NULL,\n    updated_at TIMESTAMPTZ DEFAULT NOW()\n);\n\n-- ============================================================================\n-- ROW LEVEL SECURITY (RLS) POLICIES FOR SUPABASE ANON KEY ACCESS\n-- ============================================================================\nALTER TABLE public.users ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.suppliers ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.products ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.transactions ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.restock_history ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.employees ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.losses ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.system_logs ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.settings ENABLE ROW LEVEL SECURITY;\n\n-- Allow full public / anon access for POS desktop/web operation\nCREATE POLICY \"Anon full access users\" ON public.users FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access suppliers\" ON public.suppliers FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access products\" ON public.products FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access transactions\" ON public.transactions FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access restock\" ON public.restock_history FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access employees\" ON public.employees FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access losses\" ON public.losses FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access system_logs\" ON public.system_logs FOR ALL TO anon USING (true) WITH CHECK (true);\nCREATE POLICY \"Anon full access settings\" ON public.settings FOR ALL TO anon USING (true) WITH CHECK (true);\n\n-- ============================================================================\n-- SEED INITIAL DATA\n-- ============================================================================\n\n-- Initial Users (Admin, Manager, Cashier, Temp User)\nINSERT INTO public.users (user_id, email, password, role_id, first_name, middle_name, last_name, phone_number, address, status)\nVALUES \n    (1, 'admin@bugasan.ph', 'admin123', 1, 'MARIA', 'SANTOS', 'DELA CRUZ', '+639171234567', 'Manila, Philippines', 'Active'),\n    (2, 'manager@bugasan.ph', 'manager123', 2, 'EDUARDO', 'REYES', 'CRUZ', '+639182345678', 'Quezon City, Philippines', 'Active'),\n    (3, 'cashier@bugasan.ph', 'cashier123', 3, 'ANA', 'GARCIA', 'REYES', '+639193456789', 'Pasig City, Philippines', 'Active'),\n    (4, 'newuser@bugasan.ph', 'temp4321', 3, 'JUAN', 'PEDRO', 'DE LA CRUZ', '+639204567890', 'Makati City, Philippines', 'Active')\nON CONFLICT (email) DO NOTHING;\n\n-- Initial Suppliers\nINSERT INTO public.suppliers (id, name, contact_person, phone, email, address, supplied_varieties, status)\nVALUES \n    (1, 'Central Luzon Rice Millers Corp.', 'Engr. Roberto Mendoza', '+639175550192', 'clrm_rice@millers.ph', 'Maharlika Highway, Cabanatuan City, Nueva Ecija', 'Sinandomeng, Well-Milled', 'Active'),\n    (2, 'Isabela Golden Grains Trading', 'Carmen Gutierrez', '+639185550481', 'sales@isabelagrains.ph', 'San Fermin, Cauayan City, Isabela', 'Dinorado, Jasmine Fragrant', 'Active'),\n    (3, 'Mindoro Agri-Producers Cooperative', 'Danilo Villanueva', '+639195550734', 'danilo@mindoroagricoop.org', 'Barangay Lumangbayan, Calapan, Oriental Mindoro', 'Brown Rice, Malagkit (Glutinous)', 'Active'),\n    (4, 'Bulacan Milling & Grain Depot', 'Manuel Santos', '+639205550912', 'msantos@bulacanmill.ph', 'Poblacion, Bocaue, Bulacan', 'Sinandomeng, Regular Milled', 'Inactive')\nON CONFLICT (id) DO NOTHING;\n\n-- Initial Rice Products\nINSERT INTO public.products (barcode, name, category, unit, cost_price, selling_price, stock_quantity, min_threshold, supplier_id, supplier_name, harvest_batch, expiry_date, status)\nVALUES \n    ('48000101', 'Sinandomeng Special (50kg sack)', 'Regular', '50kg sack', 2100.00, 2350.00, 42.00, 10.00, 1, 'Central Luzon Rice Millers Corp.', 'BATCH-2026-NE-01', '2027-04-15', 'In Stock'),\n    ('48000102', 'Sinandomeng Special (Per Kilo)', 'Regular', 'kg', 42.00, 48.00, 185.00, 30.00, 1, 'Central Luzon Rice Millers Corp.', 'BATCH-2026-NE-01', '2027-04-15', 'In Stock'),\n    ('48000103', 'Dinorado Premium Fragrant (50kg sack)', 'Premium', '50kg sack', 2300.00, 2600.00, 25.00, 8.00, 2, 'Isabela Golden Grains Trading', 'BATCH-2026-ISA-04', '2027-05-20', 'In Stock'),\n    ('48000104', 'Dinorado Premium Fragrant (Per Kilo)', 'Premium', 'kg', 46.00, 53.00, 110.00, 25.00, 2, 'Isabela Golden Grains Trading', 'BATCH-2026-ISA-04', '2027-05-20', 'In Stock'),\n    ('48000105', 'Jasmine Super White (50kg sack)', 'Premium', '50kg sack', 2400.00, 2700.00, 30.00, 10.00, 2, 'Isabela Golden Grains Trading', 'BATCH-2026-ISA-08', '2027-06-10', 'In Stock'),\n    ('48000106', 'Jasmine Super White (Per Kilo)', 'Premium', 'kg', 48.00, 55.00, 95.00, 20.00, 2, 'Isabela Golden Grains Trading', 'BATCH-2026-ISA-08', '2027-06-10', 'In Stock'),\n    ('48000107', 'Well-Milled Rice Grade 1 (50kg sack)', 'Regular', '50kg sack', 1850.00, 2100.00, 55.00, 15.00, 1, 'Central Luzon Rice Millers Corp.', 'BATCH-2026-NE-09', '2027-03-30', 'In Stock'),\n    ('48000108', 'Well-Milled Rice Grade 1 (Per Kilo)', 'Regular', 'kg', 37.00, 43.00, 230.00, 40.00, 1, 'Central Luzon Rice Millers Corp.', 'BATCH-2026-NE-09', '2027-03-30', 'In Stock'),\n    ('48000109', 'Glutinous Rice (Malagkit) (25kg sack)', 'Glutinous', '25kg sack', 1550.00, 1750.00, 4.00, 8.00, 3, 'Mindoro Agri-Producers Cooperative', 'BATCH-2026-MIN-02', '2027-02-28', 'Low Stock'),\n    ('48000110', 'Glutinous Rice (Malagkit) (Per Kilo)', 'Glutinous', 'kg', 62.00, 72.00, 38.00, 15.00, 3, 'Mindoro Agri-Producers Cooperative', 'BATCH-2026-MIN-02', '2027-02-28', 'In Stock'),\n    ('48000111', 'Organic Black Rice (10kg bag)', 'Specialty', '10kg sack', 750.00, 880.00, 2.00, 5.00, 3, 'Mindoro Agri-Producers Cooperative', 'BATCH-2025-MIN-11', '2026-11-25', 'Critical Low Stock'),\n    ('48000112', 'Premium Brown Rice (25kg sack)', 'Specialty', '25kg sack', 1280.00, 1450.00, 12.00, 5.00, 3, 'Mindoro Agri-Producers Cooperative', 'BATCH-2026-MIN-05', '2027-07-15', 'In Stock')\nON CONFLICT (barcode) DO NOTHING;\n\n-- Initial Employees (HR/Payroll)\nINSERT INTO public.employees (name, role, daily_rate, days_worked, overtime_hours, sss_deduction, philhealth_deduction, pagibig_deduction, other_deductions, gross_pay, net_pay, period, status)\nVALUES \n    ('Maria Santos', 'Store Administrator', 800.00, 13.0, 4.0, 550.00, 250.00, 100.00, 0.00, 10900.00, 10000.00, 'Nov 1 - Nov 15, 2026', 'Active'),\n    ('Eduardo Cruz', 'Branch Manager', 700.00, 13.0, 6.0, 500.00, 225.00, 100.00, 0.00, 9725.00, 8900.00, 'Nov 1 - Nov 15, 2026', 'Active'),\n    ('Ana Reyes', 'Senior Cashier', 550.00, 12.0, 3.0, 400.00, 180.00, 100.00, 150.00, 6856.25, 6026.25, 'Nov 1 - Nov 15, 2026', 'Active'),\n    ('Jeffrey Tan', 'POS Cashier', 520.00, 12.0, 0.0, 380.00, 170.00, 100.00, 0.00, 6240.00, 5590.00, 'Nov 1 - Nov 15, 2026', 'Active'),\n    ('Danilo Ramos', 'Warehouse & Bag Handler', 500.00, 13.0, 8.0, 360.00, 160.00, 100.00, 0.00, 7125.00, 6505.00, 'Nov 1 - Nov 15, 2026', 'Active')\nON CONFLICT DO NOTHING;\n\n-- Initial Settings\nINSERT INTO public.settings (key, value)\nVALUES \n    ('store_name', 'Bugasan Rice Retail & Trading'),\n    ('store_address', 'Stall 14-16, Poblacion Central Public Market, Philippines'),\n    ('store_tin', '452-981-002-000-VAT'),\n    ('store_phone', '+63 917 882 1904'),\n    ('tax_rate', '12'),\n    ('currency', '₱'),\n    ('low_stock_threshold', '10')\nON CONFLICT (key) DO NOTHING;\n\n-- Initial Audit Log\nINSERT INTO public.system_logs (user_name, user_role, action, details)\nVALUES \n    ('System Administrator', 'Admin', 'SYSTEM_INITIALIZED', 'Database schema and seed records initialized successfully.')\nON CONFLICT DO NOTHING;\n-- ============================================================================\r\n-- BUGASAN POS - ADD SALES & SALES ITEMS TABLES\r\n-- Execute in Supabase SQL Editor:\r\n-- https://supabase.com/dashboard/project/tagnuihzrbjxhqmzhduc/sql/new\r\n-- ============================================================================\r\n\r\n-- 1. SALES TABLE\r\nCREATE TABLE IF NOT EXISTS public.sales (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    transaction_id BIGINT REFERENCES public.transactions(id) ON DELETE CASCADE,\r\n    invoice_no TEXT NOT NULL,\r\n    cashier_id INT,\r\n    cashier_name TEXT NOT NULL,\r\n    subtotal NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    tax_rate NUMERIC(5,2) NOT NULL DEFAULT 12,\r\n    tax_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    discount_type TEXT DEFAULT 'None',\r\n    discount_id TEXT DEFAULT '',\r\n    discount_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    total_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    payment_method TEXT NOT NULL DEFAULT 'Cash',\r\n    payment_reference TEXT DEFAULT '',\r\n    amount_tendered NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    change_amount NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    status TEXT DEFAULT 'Completed',\r\n    created_at TIMESTAMPTZ DEFAULT NOW()\r\n);\r\n\r\n-- 2. SALES_ITEMS (ITEMIZED BREAKDOWN PER SALE)\r\nCREATE TABLE IF NOT EXISTS public.sales_items (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    sale_id BIGINT REFERENCES public.sales(id) ON DELETE CASCADE,\r\n    transaction_id BIGINT REFERENCES public.transactions(id) ON DELETE CASCADE,\r\n    invoice_no TEXT NOT NULL,\r\n    product_id BIGINT REFERENCES public.products(id) ON DELETE SET NULL,\r\n    product_name TEXT NOT NULL,\r\n    barcode TEXT NOT NULL,\r\n    unit TEXT DEFAULT '50kg sack',\r\n    unit_price NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    quantity NUMERIC(12,2) NOT NULL DEFAULT 1,\r\n    subtotal NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    created_at TIMESTAMPTZ DEFAULT NOW()\r\n);\r\n\r\n-- 3. SALES_ITEM (COMPATIBILITY ALIAS TABLE)\r\nCREATE TABLE IF NOT EXISTS public.sales_item (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    sale_id BIGINT,\r\n    transaction_id BIGINT REFERENCES public.transactions(id) ON DELETE CASCADE,\r\n    invoice_no TEXT NOT NULL,\r\n    product_id BIGINT REFERENCES public.products(id) ON DELETE SET NULL,\r\n    product_name TEXT NOT NULL,\r\n    barcode TEXT NOT NULL,\r\n    unit TEXT DEFAULT '50kg sack',\r\n    unit_price NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    quantity NUMERIC(12,2) NOT NULL DEFAULT 1,\r\n    subtotal NUMERIC(12,2) NOT NULL DEFAULT 0,\r\n    created_at TIMESTAMPTZ DEFAULT NOW()\r\n);\r\n\r\n-- 4. ENABLE ROW LEVEL SECURITY\r\nALTER TABLE public.sales ENABLE ROW LEVEL SECURITY;\r\nALTER TABLE publ const getSeedData = () => {

class BugasanStore {
    constructor() {
        this.STORAGE_KEY = 'bugasan_pos_data_v1';
        this.SESSION_KEY = 'bugasan_pos_session_v1';
        this.currentUser = null;
        this.cart = [];
        this.activeTaxRate = 12; // default 12%
        this.activeDiscountType = 'None';
        this.discountIdNumber = '';
        this.discountCustomerName = '';
        this.supabaseOnline = false;
        this.syncStatus = 'Local Storage Mode (Sync Ready)';
        this.init();
    }

    init() {
        const defaultSeeds = getSeedData();
        // Load data from localStorage or fallback to SEED_DATA
        const hasLocalStorage = typeof localStorage !== 'undefined';
        let saved = hasLocalStorage ? localStorage.getItem(this.STORAGE_KEY) : null;
        if (!saved) {
            this.data = JSON.parse(JSON.stringify(defaultSeeds));
            this.saveLocal();
        } else {
            try {
                this.data = JSON.parse(saved);
                // Ensure all tables exist
                for (let k in defaultSeeds) {
                    if (!this.data[k]) this.data[k] = JSON.parse(JSON.stringify(defaultSeeds[k]));
                }
            } catch (e) {
                console.error("Corrupted local storage, resetting to seed data:", e);
                this.data = JSON.parse(JSON.stringify(defaultSeeds));
                this.saveLocal();
            }
        }

        // Check active session
        const hasSession = typeof sessionStorage !== 'undefined';
        const session = hasSession ? sessionStorage.getItem(this.SESSION_KEY) : null;
        if (session) {
            try {
                this.currentUser = JSON.parse(session);
            } catch (e) {
                this.currentUser = null;
            }
        }

        // Load active tax rate from settings
        if (this.data.settings && this.data.settings.tax_rate) {
            this.activeTaxRate = parseFloat(this.data.settings.tax_rate) || 12;
        }

        // Test Supabase connectivity in background (browser only)
        if (typeof fetch !== 'undefined') {
            this.checkSupabaseConnection();
        }
    }

    saveLocal() {
        if (typeof localStorage !== 'undefined') {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.data));
        }
    }

    async checkSupabaseConnection() {
        const rawUrl = this.data.settings.supabase_url;
        const key = this.data.settings.supabase_key;
        if (!rawUrl || !key) {
            this.supabaseOnline = false;
            this.syncStatus = 'Offline (No credentials)';
            return false;
        }

        const url = rawUrl.endsWith('/') ? rawUrl : rawUrl + '/';

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);
            const res = await fetch(`${url}settings?select=*`, {
                method: 'GET',
                headers: {
                    'apikey': key,
                    'Authorization': `Bearer ${key}`
                },
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (res.ok) {
                this.supabaseOnline = true;
                this.syncStatus = 'Supabase Cloud Connected';
                return true;
            } else {
                // Table might not be created yet, but server reached
                this.supabaseOnline = false;
                this.syncStatus = 'Supabase Reached (Schema Pending)';
                return false;
            }
        } catch (e) {
            this.supabaseOnline = false;
            this.syncStatus = 'Local Storage Mode';
            return false;
        }
    }

    // Push local data to Supabase if tables exist
    async syncToSupabase() {
        const rawUrl = this.data.settings.supabase_url;
        const key = this.data.settings.supabase_key;
        if (!rawUrl || !key) return { success: false, message: 'Supabase credentials missing' };

        const url = rawUrl.endsWith('/') ? rawUrl : rawUrl + '/';

        try {
            // Test inserting an audit log
            const res = await fetch(`${url}system_logs`, {
                method: 'POST',
                headers: {
                    'apikey': key,
                    'Authorization': `Bearer ${key}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    user_name: this.currentUser ? this.currentUser.first_name + ' ' + this.currentUser.last_name : 'Admin',
                    user_role: this.currentUser ? this.currentUser.role_name : 'Admin',
                    action: 'SYNC_TEST',
                    details: 'Sync triggered from web client at ' + new Date().toISOString()
                })
            });

            if (res.ok) {
                this.supabaseOnline = true;
                this.syncStatus = 'Supabase Cloud Synced';

                // Push transactions, sales, and sales_items to cloud
                const headers = {
                    'apikey': key,
                    'Authorization': `Bearer ${key}`,
                    'Content-Type': 'application/json'
                };
                if (Array.isArray(this.data.transactions) && this.data.transactions.length > 0) {
                    for (const tx of this.data.transactions.slice(0, 5)) {
                        fetch(`${url}transactions`, { method: 'POST', headers, body: JSON.stringify(tx) }).catch(() => {});
                    }
                }
                if (Array.isArray(this.data.sales) && this.data.sales.length > 0) {
                    for (const s of this.data.sales.slice(0, 5)) {
                        fetch(`${url}sales`, { method: 'POST', headers, body: JSON.stringify(s) }).catch(() => {});
                    }
                }
                if (Array.isArray(this.data.sales_items) && this.data.sales_items.length > 0) {
                    for (const si of this.data.sales_items.slice(0, 10)) {
                        fetch(`${url}sales_items`, { method: 'POST', headers, body: JSON.stringify(si) }).catch(() => {});
                        fetch(`${url}sales_item`, { method: 'POST', headers, body: JSON.stringify(si) }).catch(() => {});
                    }
                }

                return { success: true, message: 'Successfully synced transactions, sales & audit logs to Supabase Cloud!' };
            } else {
                let errMsg = 'Supabase error';
                try {
                    const err = await res.json();
                    errMsg = err.message || errMsg;
                } catch (jsonErr) {}
                const isSchema = errMsg.includes('schema cache') || errMsg.includes('Could not find the table') || res.status === 404;
                if (isSchema) {
                    this.syncStatus = 'Supabase Reached (Schema Pending)';
                }
                return { 
                    success: false, 
                    isSchemaPending: isSchema, 
                    message: isSchema ? 'Supabase tables not found. Please run the SQL schema in your Supabase SQL editor!' : errMsg 
                };
            }
        } catch (e) {
            return { success: false, message: 'Connection error: ' + e.message };
        }
    }

        user.last_name = payload.last_name.toUpperCase();

    addToCartByBarcode(barcode) {
        const cleanBarcode = barcode.trim();
        const product = this.data.products.find(p => p.barcode === cleanBarcode);
        if (!product) {
            return { success: false, message: `Product with barcode "${cleanBarcode}" not found.` };

    }

    addToCart(productId, qtyToAdd = 1) {
        const product = this.data.products.find(p => p.id === productId);
        if (!product) return { success: false, message: 'Product not found.' };

        if (product.stock_quantity <= 0) {
            return { success: false, message: `"${product.name}" is currently OUT OF STOCK!` };
        }

        const existing = this.cart.find(item => item.product_id === productId);
        const currentInCart = existing ? existing.quantity : 0;

        if (currentInCart + qtyToAdd > product.stock_quantity) {
            return { 
                success: false, 
                message: `Cannot add more. Only ${product.stock_quantity} ${product.unit} available in stock.` 
            };
        }

        if (existing) {
            existing.quantity = parseFloat((existing.quantity + qtyToAdd).toFixed(2));
            existing.total = parseFloat((existing.quantity * existing.unit_price).toFixed(2));
        } else {
            this.cart.push({
                product_id: product.id,
                barcode: product.barcode,
                name: product.name,
                category: product.category,
                unit: product.unit,
                unit_price: product.selling_price,
                cost_price: product.cost_price,
                quantity: parseFloat(qtyToAdd.toFixed(2)),
                total: parseFloat((product.selling_price * qtyToAdd).toFixed(2))
            });
        }
        return { success: true, message: `Added "${product.name}" to cart.` };
    }

    updateCartItemQty(productId, newQty) {
        const product = this.data.products.find(p => p.id === productId);
        const item = this.cart.find(i => i.product_id === productId);
        if (!item || !product) return { success: false, message: 'Item not in cart' };

        const qty = parseFloat(newQty);
        if (isNaN(qty) || qty <= 0) {
            this.removeFromCart(productId);
            return { success: true, message: 'Removed from cart' };
        }

        if (qty > product.stock_quantity) {
            item.quantity = parseFloat(product.stock_quantity.toFixed(2));
            item.total = parseFloat((item.quantity * item.unit_price).toFixed(2));
            return {
                success: false,
                capped: true,
                message: `Maximum available stock is ${product.stock_quantity} ${product.unit}. Set to maximum.`
            };
        } else {
            item.quantity = parseFloat(qty.toFixed(2));
            item.total = parseFloat((item.quantity * item.unit_price).toFixed(2));
            return { success: true, message: 'Quantity updated' };
        }
    }

    removeFromCart(productId) {
        this.cart = this.cart.filter(item => item.product_id !== productId);
        return true;
    }

    clearCart() {
        this.cart = [];
        this.activeDiscountType = 'None';
        this.discountIdNumber = '';
        this.discountCustomerName = '';
    }

    // Computes subtotal, tax, discount, grand total
    calculateCartTotals() {
        const subtotal = this.cart.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
        let taxRate = this.activeTaxRate || 0;
        let discountRate = 0;

        if (this.activeDiscountType === 'Senior Citizen' || this.activeDiscountType === 'PWD') {
            discountRate = 0.20; // 20% statutory discount
        }

        let discountAmount = 0;
        let taxAmount = 0;
        let totalAmount = 0;

        if (this.activeDiscountType === 'Senior Citizen' || this.activeDiscountType === 'PWD') {
            // According to Philippine BIR law (RA 9994 / RA 10754):
            // 20% discount is applied to the VAT-exempt sales amount
            discountAmount = subtotal * 0.20;
            taxAmount = 0; // VAT Exempt
            totalAmount = subtotal - discountAmount;
        } else {
            // Standard Taxable Sale
            taxAmount = (subtotal * taxRate) / 100;
            totalAmount = subtotal + taxAmount;
        }

        return {
            subtotal: parseFloat(subtotal.toFixed(2)),
            taxRate: taxRate,
            taxAmount: parseFloat(taxAmount.toFixed(2)),
            discountType: this.activeDiscountType,
            discountId: this.discountIdNumber,
            customerName: this.discountCustomerName,
            discountAmount: parseFloat(discountAmount.toFixed(2)),
            totalAmount: parseFloat(totalAmount.toFixed(2))
        };
    }

    // Checkout and generate transaction + decrease stock
    processCheckout(paymentMethod, amountTendered, referenceNumber = '') {
        if (this.cart.length === 0) {
            return { success: false, message: 'Cart is empty!' };
        }

        const totals = this.calculateCartTotals();
        const tendered = parseFloat(amountTendered);

        if (isNaN(tendered) || tendered < totals.totalAmount) {
            return {
                success: false,
                message: `Insufficient payment tendered. Total is ₱${totals.totalAmount.toFixed(2)}, tendered ₱${tendered.toFixed(2)}.`
            };
        }

        // Validate stock availability for all cart items before proceeding
        for (const item of this.cart) {
            const product = this.data.products.find(p => p.id === item.product_id);
            if (!product) {
                return { success: false, message: `Product "${item.name}" not found in inventory catalog.` };
            }
            if (product.stock_quantity < item.quantity) {
                return {
                    success: false,
                    message: `Insufficient stock for "${item.name}". Available: ${product.stock_quantity} ${product.unit}, requested: ${item.quantity}.`
                };
            }
        }

        const change = tendered - totals.totalAmount;
        const now = new Date();
        const ymd = now.toISOString().slice(0, 10).replace(/-/g, '');
        const invSeq = String(this.data.transactions.length + 1).padStart(4, '0');
        const invoiceNo = `INV-${ymd}-${invSeq}`;

        const transaction = {
            id: Date.now(),
            invoice_no: invoiceNo,
            cashier_id: this.currentUser ? this.currentUser.user_id || this.currentUser.id : 1,
            cashier_name: this.currentUser ? `${this.currentUser.first_name} ${this.currentUser.last_name}` : 'Cashier',
            items: JSON.parse(JSON.stringify(this.cart)),
            subtotal: totals.subtotal,
            tax_rate: totals.taxRate,
            tax_amount: totals.taxAmount,
            discount_type: totals.discountType,
            discount_id: totals.discountId,
            customer_name: totals.customerName,
            discount_amount: totals.discountAmount,
            total_amount: totals.totalAmount,
            payment_method: paymentMethod, // 'Cash', 'GCash', 'Maya', 'MariBank'
            payment_reference: referenceNumber,
            amount_tendered: tendered,
            change_amount: parseFloat(change.toFixed(2)),
            status: 'Completed',
            created_at: now.toISOString()
        };

        // Deduct inventory stock with precision
        this.cart.forEach(cartItem => {
            const product = this.data.products.find(p => p.id === cartItem.product_id);
            if (product) {
                product.stock_quantity = parseFloat(Math.max(0, product.stock_quantity - cartItem.quantity).toFixed(2));
                this.updateProductStockStatus(product);
            }
        });

        this.data.transactions.unshift(transaction);

        // Normalized sales and sales_items records
        if (!this.data.sales) this.data.sales = [];
        const saleRecord = {
            id: transaction.id,
            transaction_id: transaction.id,
            invoice_no: invoiceNo,
            cashier_id: transaction.cashier_id,
            cashier_name: transaction.cashier_name,
            subtotal: totals.subtotal,
            tax_rate: totals.taxRate,
            tax_amount: totals.taxAmount,
            discount_type: totals.discountType,
            discount_id: totals.discountId,
            discount_amount: totals.discountAmount,
            total_amount: totals.totalAmount,
            payment_method: paymentMethod,
            payment_reference: referenceNumber,
            amount_tendered: tendered,
            change_amount: parseFloat(change.toFixed(2)),
            status: 'Completed',
            created_at: now.toISOString()
        };
        this.data.sales.unshift(saleRecord);

        if (!this.data.sales_items) this.data.sales_items = [];
        this.cart.forEach((cartItem, idx) => {
            const saleItem = {
                id: Date.now() + idx,
                sale_id: transaction.id,
                transaction_id: transaction.id,
                invoice_no: invoiceNo,
                product_id: cartItem.product_id,
                product_name: cartItem.name,
                barcode: cartItem.barcode,
                unit: cartItem.unit,
                unit_price: cartItem.unit_price,
                quantity: cartItem.quantity,
                subtotal: cartItem.total,
                created_at: now.toISOString()
            };
            this.data.sales_items.unshift(saleItem);
        });

        // Background sync to Supabase if connected
        if (this.supabaseOnline) {
            const rawUrl = this.data.settings.supabase_url;
            const key = this.data.settings.supabase_key;
            const url = rawUrl.endsWith('/') ? rawUrl : rawUrl + '/';
            const headers = { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' };
            
            fetch(`${url}transactions`, { method: 'POST', headers, body: JSON.stringify(transaction) }).catch(() => {});
            fetch(`${url}sales`, { method: 'POST', headers, body: JSON.stringify(saleRecord) }).catch(() => {});
            this.cart.forEach(cartItem => {
                const sItem = {
                    sale_id: transaction.id,
                    transaction_id: transaction.id,
                    invoice_no: invoiceNo,
                    product_id: cartItem.product_id,
                    product_name: cartItem.name,
                    barcode: cartItem.barcode,
                    unit: cartItem.unit,
                    unit_price: cartItem.unit_price,
                    quantity: cartItem.quantity,
                    subtotal: cartItem.total
                };
                fetch(`${url}sales_items`, { method: 'POST', headers, body: JSON.stringify(sItem) }).catch(() => {});
                fetch(`${url}sales_item`, { method: 'POST', headers, body: JSON.stringify(sItem) }).catch(() => {});
            });
        }

        this.saveLocal();

        this.logAction('SALE', `Completed Sale ${invoiceNo} (Total: ₱${totals.totalAmount.toFixed(2)} via ${paymentMethod}).`);
        this.clearCart();

        return { success: true, transaction: transaction };
    }

    updateProductStockStatus(product) {
        if (product.stock_quantity <= 0) {
            product.status = 'Out of Stock';
        } else if (product.stock_quantity <= product.min_threshold / 2) {
            product.status = 'Critical Low Stock';
        } else if (product.stock_quantity <= product.min_threshold) {
            product.status = 'Low Stock';
        } else {
            product.status = 'In Stock';
        }
    }

    // ==========================================
    // VOID TRANSACTION & RESTORE INVENTORY
    // ==========================================
    voidTransaction(transactionId, reason = 'Customer Cancellation / Void') {
        const tx = this.data.transactions.find(t => t.id === transactionId || t.invoice_no === String(transactionId));
        if (!tx) return { success: false, message: 'Transaction record not found.' };
        if (tx.status === 'Voided') return { success: false, message: 'This transaction is already marked as Voided.' };

        const voidReason = (reason || '').trim() || 'Voided by authorized manager';
        const now = new Date().toISOString();
        const voidedBy = this.currentUser ? `${this.currentUser.first_name} ${this.currentUser.last_name} (${this.currentUser.role_name})` : 'Authorized Staff';

        tx.status = 'Voided';
        tx.voided_at = now;
        tx.voided_by = voidedBy;
        tx.void_reason = voidReason;

        // Restore deducted product inventory stock
        let restoredCount = 0;
        if (Array.isArray(tx.items)) {
            tx.items.forEach(item => {
                const product = this.data.products.find(p => p.id === item.product_id);
                if (product) {
                    product.stock_quantity = parseFloat((product.stock_quantity + item.quantity).toFixed(2));
                    this.updateProductStockStatus(product);
                    restoredCount++;
                }
            });
        }

        this.saveLocal();
        this.logAction('VOID_TRANSACTION', `Voided invoice ${tx.invoice_no} (₱${tx.total_amount.toFixed(2)}) by ${voidedBy}. Reason: ${voidReason}. Restored stock for ${restoredCount} item(s).`);
        return { success: true, transaction: tx, restoredCount: restoredCount };
    }

    // ==========================================
    // INVENTORY & RESTOCKING
    // ==========================================
    addProduct(payload) {
        const barcode = payload.barcode.trim();
        if (this.data.products.some(p => p.barcode === barcode)) {
            return { success: false, message: `Barcode "${barcode}" already exists!` };
        }

        const newProduct = {
            id: Date.now(),
            barcode: barcode,
            name: payload.name.trim(),
            category: payload.category || 'Regular',
            unit: payload.unit || '50kg sack',
            cost_price: parseFloat(payload.cost_price) || 0,
            selling_price: parseFloat(payload.selling_price) || 0,
            stock_quantity: parseFloat(payload.stock_quantity) || 0,
            min_threshold: parseFloat(payload.min_threshold) || 10,
            supplier_id: payload.supplier_id ? parseInt(payload.supplier_id) : null,
            supplier_name: payload.supplier_name || '',
            harvest_batch: payload.harvest_batch || '',
            expiry_date: payload.expiry_date || '',
            status: 'In Stock',
            created_at: new Date().toISOString()
        };

        this.updateProductStockStatus(newProduct);
        this.data.products.unshift(newProduct);
        this.saveLocal();
        this.logAction('PRODUCT_ADDED', `Added new product "${newProduct.name}" [${newProduct.barcode}].`);
        return { success: true, product: newProduct };
    }

    editProduct(id, payload) {
        const product = this.data.products.find(p => p.id === id);
        if (!product) return { success: false, message: 'Product not found' };

        // Duplicate barcode check
        const barcode = payload.barcode.trim();
        if (this.data.products.some(p => p.id !== id && p.barcode === barcode)) {
            return { success: false, message: `Barcode "${barcode}" is used by another product!` };
        }

        product.barcode = barcode;
        product.name = payload.name.trim();
        product.category = payload.category;
        product.unit = payload.unit;
        product.cost_price = parseFloat(payload.cost_price);
        product.selling_price = parseFloat(payload.selling_price);
        product.min_threshold = parseFloat(payload.min_threshold);
        product.supplier_id = payload.supplier_id ? parseInt(payload.supplier_id) : null;
        product.supplier_name = payload.supplier_name || '';
        product.harvest_batch = payload.harvest_batch;
        product.expiry_date = payload.expiry_date;

        this.updateProductStockStatus(product);
        this.saveLocal();
        this.logAction('PRODUCT_UPDATED', `Updated product details for "${product.name}".`);
        return { success: true, product: product };
    }

    restockProduct(productId, quantity, supplierId, costPerUnit, notes = '') {
        const product = this.data.products.find(p => p.id === productId);
        if (!product) return { success: false, message: 'Product not found' };

        const qty = parseFloat(quantity);
        const cost = parseFloat(costPerUnit) || product.cost_price;
        if (isNaN(qty) || qty <= 0) return { success: false, message: 'Invalid restock quantity.' };

        const supplier = this.data.suppliers.find(s => s.id === parseInt(supplierId));
        const supplierName = supplier ? supplier.name : product.supplier_name;

        // Increase product stock
        product.stock_quantity += qty;
        product.cost_price = cost;
        if (supplier) {
            product.supplier_id = supplier.id;
            product.supplier_name = supplier.name;
        }
        this.updateProductStockStatus(product);

        const restockRecord = {
            id: Date.now(),
            product_id: product.id,
            product_name: product.name,
            barcode: product.barcode,
            quantity: qty,
            unit: product.unit,
            supplier_id: supplier ? supplier.id : null,
            supplier_name: supplierName,
            cost_per_unit: cost,
            total_cost: qty * cost,
            restocked_by: this.currentUser ? `${this.currentUser.first_name} ${this.currentUser.last_name}` : 'Store Manager',
            notes: notes,
            created_at: new Date().toISOString()
        };

        this.data.restock_history.unshift(restockRecord);
        this.saveLocal();
        this.logAction('RESTOCK', `Restocked ${qty} ${product.unit} of "${product.name}" from ${supplierName}.`);
        return { success: true, record: restockRecord };
    }

    // ==========================================
    // SUPPLIERS
    // ==========================================
    addSupplier(payload) {
        const newSupplier = {
            id: Date.now(),
            name: payload.name.trim(),
            contact_person: payload.contact_person || '',
            phone: payload.phone || '',
            email: payload.email || '',
            address: payload.address || '',
            supplied_varieties: payload.supplied_varieties || '',
            status: 'Active',
            created_at: new Date().toISOString()
        };
        this.data.suppliers.unshift(newSupplier);
        this.saveLocal();
        this.logAction('SUPPLIER_ADDED', `Registered supplier "${newSupplier.name}".`);
        return { success: true, supplier: newSupplier };
    }

    editSupplier(id, payload) {
        const supplier = this.data.suppliers.find(s => s.id === id);
        if (!supplier) return { success: false, message: 'Supplier not found' };

        supplier.name = payload.name.trim();
        supplier.contact_person = payload.contact_person;
        supplier.phone = payload.phone;
        supplier.email = payload.email;
        supplier.address = payload.address;
        supplier.supplied_varieties = payload.supplied_varieties;
        if (payload.status) supplier.status = payload.status;

        this.saveLocal();
        this.logAction('SUPPLIER_UPDATED', `Updated details for supplier "${supplier.name}".`);
        return { success: true, supplier: supplier };
    }

    toggleSupplierStatus(id) {
        const supplier = this.data.suppliers.find(s => s.id === id);
        if (!supplier) return false;
        supplier.status = supplier.status === 'Active' ? 'Inactive' : 'Active';
        this.saveLocal();
        this.logAction('SUPPLIER_STATUS_TOGGLED', `Supplier "${supplier.name}" marked as ${supplier.status}.`);
        return true;
    }

    // ==========================================
    // HR & PAYROLL (Gross, Deductions, Net Pay)
    // ==========================================
    calculatePayrollValues(dailyRate, daysWorked, overtimeHours, sss, philhealth, pagibig, other) {
        const rate = parseFloat(dailyRate) || 0;
        const days = parseFloat(daysWorked) || 0;
        const otHours = parseFloat(overtimeHours) || 0;

        const basicPay = rate * days;
        const hourlyRate = rate / 8;
        const overtimePay = (hourlyRate * 1.25) * otHours; // standard 125% OT rate
        const grossPay = basicPay + overtimePay;

        const sssDed = parseFloat(sss) || 0;
        const phDed = parseFloat(philhealth) || 0;
        const hdmfDed = parseFloat(pagibig) || 0;
        const otherDed = parseFloat(other) || 0;

        const totalDeductions = sssDed + phDed + hdmfDed + otherDed;
        const netPay = Math.max(0, grossPay - totalDeductions);

        return {
            basicPay: parseFloat(basicPay.toFixed(2)),
            overtimePay: parseFloat(overtimePay.toFixed(2)),
            grossPay: parseFloat(grossPay.toFixed(2)),
            totalDeductions: parseFloat(totalDeductions.toFixed(2)),
            netPay: parseFloat(netPay.toFixed(2))
        };
    }

    addOrUpdateEmployee(payload, id = null) {
        const calcs = this.calculatePayrollValues(
            payload.daily_rate,
            payload.days_worked,
            payload.overtime_hours,
            payload.sss_deduction,
            payload.philhealth_deduction,
            payload.pagibig_deduction,
            payload.other_deductions
        );

        if (id) {
            const emp = this.data.employees.find(e => e.id === id);
            if (!emp) return { success: false, message: 'Employee not found' };
            emp.name = payload.name;
            emp.role = payload.role;
            emp.daily_rate = parseFloat(payload.daily_rate);
            emp.days_worked = parseFloat(payload.days_worked);
            emp.overtime_hours = parseFloat(payload.overtime_hours);
            emp.sss_deduction = parseFloat(payload.sss_deduction) || 0;
            emp.philhealth_deduction = parseFloat(payload.philhealth_deduction) || 0;
            emp.pagibig_deduction = parseFloat(payload.pagibig_deduction) || 0;
            emp.other_deductions = parseFloat(payload.other_deductions) || 0;
            emp.gross_pay = calcs.grossPay;
            emp.net_pay = calcs.netPay;
            emp.period = payload.period || 'Current Cutoff';
            this.saveLocal();
            this.logAction('PAYROLL_UPDATED', `Updated payroll calculation for ${emp.name}.`);
            return { success: true, employee: emp };
        } else {
            const newEmp = {
                id: Date.now(),
                name: payload.name,
                role: payload.role,
                daily_rate: parseFloat(payload.daily_rate),
                days_worked: parseFloat(payload.days_worked),
                overtime_hours: parseFloat(payload.overtime_hours),
                sss_deduction: parseFloat(payload.sss_deduction) || 0,
                philhealth_deduction: parseFloat(payload.philhealth_deduction) || 0,
                pagibig_deduction: parseFloat(payload.pagibig_deduction) || 0,
                other_deductions: parseFloat(payload.other_deductions) || 0,
                gross_pay: calcs.grossPay,
                net_pay: calcs.netPay,
                period: payload.period || 'Current Cutoff',
                status: 'Active',
                created_at: new Date().toISOString()
            };
            this.data.employees.push(newEmp);
            this.saveLocal();
            this.logAction('PAYROLL_RECORD_ADDED', `Processed payroll record for ${newEmp.name} (Net: ₱${calcs.netPay.toFixed(2)}).`);
            return { success: true, employee: newEmp };
        }
    }

    // ==========================================
    // LOSSES & SPOILAGE
    // ==========================================
    logLoss(productId, quantity, reason, notes = '') {
        const product = this.data.products.find(p => p.id === productId);
        if (!product) return { success: false, message: 'Product not found' };

        const qty = parseFloat(quantity);
        if (isNaN(qty) || qty <= 0) return { success: false, message: 'Invalid quantity.' };

        if (qty > product.stock_quantity) {
            return { success: false, message: `Cannot write off ${qty}. Current stock is only ${product.stock_quantity}.` };
        }

        const costLoss = qty * product.cost_price;

        // Deduct inventory stock
        product.stock_quantity -= qty;
        this.updateProductStockStatus(product);

        const lossRecord = {
            id: Date.now(),
            product_id: product.id,
            product_name: product.name,
            quantity: qty,
            unit: product.unit,
            reason: reason, // 'Damaged Sack', 'Pest/Weevil Infestation', 'Moisture Spoilage', 'Spillage'
            cost_loss: costLoss,
            logged_by: this.currentUser ? `${this.currentUser.first_name} ${this.currentUser.last_name}` : 'Staff',
            notes: notes,
            created_at: new Date().toISOString()
        };

        this.data.losses.unshift(lossRecord);
        this.saveLocal();
        this.logAction('LOSS_LOGGED', `Logged loss of ${qty} ${product.unit} of "${product.name}" (${reason}) - ₱${costLoss.toFixed(2)}.`);
        return { success: true, loss: lossRecord };
    }

    // ==========================================
    // SYSTEM ALERTS COMPUTATION
    // ==========================================
    getSystemAlerts() {
        const lowStock = [];
        const expiringSoon = [];
        const now = new Date();

        this.data.products.forEach(p => {
            // Low Stock check
            if (p.stock_quantity <= p.min_threshold) {
                lowStock.push({
                    id: p.id,
                    name: p.name,
                    barcode: p.barcode,
                    stock: p.stock_quantity,
                    threshold: p.min_threshold,
                    unit: p.unit,
                    type: p.stock_quantity === 0 ? 'Out of Stock' : (p.stock_quantity <= p.min_threshold / 2 ? 'Critical' : 'Low Stock')
                });
            }

            // Expiry check (within 60 days or past due)
            if (p.expiry_date) {
                const expDate = new Date(p.expiry_date);
                const diffDays = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
                if (diffDays <= 60) {
                    expiringSoon.push({
                        id: p.id,
                        name: p.name,
                        barcode: p.barcode,
                        batch: p.harvest_batch,
                        expiry_date: p.expiry_date,
                        days_left: diffDays,
                        is_expired: diffDays <= 0,
                        unit: p.unit,
                        stock: p.stock_quantity
                    });
                }
            }
        });

        return {
            lowStock: lowStock,
            expiringSoon: expiringSoon,
            totalAlerts: lowStock.length + expiringSoon.length
        };
    }

    // ==========================================
    // REPORTS & INCOME STATEMENT
    // ==========================================
    getFinancialReport(filterDays = 'all') {
        const now = new Date();
        let cutoff = null;
        if (filterDays === 'today') {
            cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        } else if (filterDays === 'week') {
            cutoff = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        } else if (filterDays === 'month') {
            cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        }

        const txs = this.data.transactions.filter(t => {
            if (t.status === 'Voided') return false;
            if (!cutoff) return true;
            return new Date(t.created_at) >= cutoff;
        });

        const grossSales = txs.reduce((sum, t) => sum + (t.subtotal || 0), 0);
        const totalDiscounts = txs.reduce((sum, t) => sum + (t.discount_amount || 0), 0);
        const netSales = txs.reduce((sum, t) => sum + (t.total_amount || 0), 0);

        // COGS (Cost of goods sold)
        let totalCOGS = 0;
        txs.forEach(t => {
            if (Array.isArray(t.items)) {
                t.items.forEach(item => {
                    const cost = item.cost_price || 0;
                    totalCOGS += cost * item.quantity;
                });
            }
        });

        const grossProfit = netSales - totalCOGS;

        // Operating Expenses: Payroll + Spoilage
        const payrollExpense = this.data.employees.reduce((sum, e) => sum + (e.gross_pay || 0), 0);
        const lossesExpense = this.data.losses.reduce((sum, l) => sum + (l.cost_loss || 0), 0);
        const totalOperatingExpenses = payrollExpense + lossesExpense;

        const netIncome = grossProfit - totalOperatingExpenses;

        return {
            transactionsCount: txs.length,
            grossSales: parseFloat(grossSales.toFixed(2)),
            totalDiscounts: parseFloat(totalDiscounts.toFixed(2)),
            netSales: parseFloat(netSales.toFixed(2)),
            totalCOGS: parseFloat(totalCOGS.toFixed(2)),
            grossProfit: parseFloat(grossProfit.toFixed(2)),
            payrollExpense: parseFloat(payrollExpense.toFixed(2)),
            lossesExpense: parseFloat(lossesExpense.toFixed(2)),
            totalOperatingExpenses: parseFloat(totalOperatingExpenses.toFixed(2)),
            netIncome: parseFloat(netIncome.toFixed(2)),
            filteredTransactions: txs
        };
    }
}

};

// Initialize Store and Application State
const store = new BugasanStore();

const app = {
    currentView: 'pos', // default view for cashier/admin
    activePaymentMethod: 'Cash',
    activeModal: null,

    init() {
        // Handle initial routing based on session
        if (!store.currentUser) {
            this.renderLogin();
        } else {
            // Default landing view based on role
            if (store.currentUser.role_name === 'Admin') {
                this.currentView = 'dashboard';
            } else if (store.currentUser.role_name === 'Manager') {
                this.currentView = 'dashboard';
            } else {
                this.currentView = 'pos';
            }
            this.renderApp();
        }

        this.setupKeyboardShortcuts();
    },

    // Mouseless Keyboard Shortcuts Listener
    setupKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
            // Ignore shortcuts if in login screen or complete profile modal
            if (!store.currentUser) return;
            if (document.getElementById('profile-setup-modal')) return;

            // F1: Focus Barcode Input
            if (e.key === 'F1') {
                e.preventDefault();
                if (this.currentView !== 'pos') this.navigate('pos');
                setTimeout(() => {
                    const el = document.getElementById('pos-barcode-input');
                    if (el) { el.focus(); el.select(); }
                }, 50);
            }
            // F2: Focus Live Product Search
            else if (e.key === 'F2') {
                e.preventDefault();
                if (this.currentView !== 'pos') this.navigate('pos');
                setTimeout(() => {
                    const el = document.getElementById('pos-search-input');
                    if (el) { el.focus(); el.select(); }
                }, 50);
            }
            // F3: Apply Discount Modal
            else if (e.key === 'F3') {
                e.preventDefault();
                this.showModal('discount-modal');
            }
            // F4: Open Checkout / Tender
            else if (e.key === 'F4') {
                e.preventDefault();
                if (store.cart.length > 0) {
                    this.openCheckoutModal();
                } else {
                    this.showToast('Cart is empty. Add products first.', 'warning');
                }
            }
            // F7: Clear Cart
            else if (e.key === 'F7') {
                e.preventDefault();
                if (store.cart.length > 0 && confirm('Clear all items from current order?')) {
                    this.clearCart();
                }
            }
            // F8: Quick Cash Tab (Inside checkout modal)
            else if (e.key === 'F8') {
                const modal = document.getElementById('checkout-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    e.preventDefault();
                    this.setPaymentMethodTab('Cash');
                }
            }
            // F9: Quick Cashless Tab (Inside checkout modal)
            else if (e.key === 'F9') {
                const modal = document.getElementById('checkout-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    e.preventDefault();
                    this.setPaymentMethodTab('GCash');
                }
            }
            // F10: Confirm Payment & Generate Receipt
            else if (e.key === 'F10') {
                const modal = document.getElementById('checkout-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    e.preventDefault();
                    this.submitCheckoutPayment();
                }
            }
            // Escape: Close any open modal
            else if (e.key === 'Escape') {
                this.closeAllModals();
            }
        });
    },

    renderApp() {
        const root = document.getElementById('app-root');
        if (!root) return;

        const role = store.currentUser ? store.currentUser.role_name : 'Cashier';

        // Render main frame
        let mainContent = '';
        switch (this.currentView) {
            case 'dashboard':
                mainContent = ADMIN_REPORTS_UI.renderDashboard(store);
                break;
            case 'pos':
                mainContent = POS_UI.renderPOSView(store);
                break;
            case 'inventory':
                mainContent = INVENTORY_UI.renderInventoryView(store);
                break;
            case 'suppliers':
                mainContent = INVENTORY_UI.renderSuppliersView(store);
                break;
            case 'payroll':
                mainContent = ADMIN_REPORTS_UI.renderPayrollView(store);
                break;
            case 'losses':
                mainContent = INVENTORY_UI.renderLossesView(store);
                break;
            case 'reports':
                mainContent = ADMIN_REPORTS_UI.renderReportsView(store, this.reportFilter || 'all');
                break;
            case 'accounts':
                mainContent = ADMIN_REPORTS_UI.renderAccountsView(store);
                break;
            case 'logs':
                mainContent = ADMIN_REPORTS_UI.renderAuditLogsView(store);
                break;
            case 'settings':
                mainContent = ADMIN_REPORTS_UI.renderSettingsView(store);
                break;
            default:
                mainContent = POS_UI.renderPOSView(store);
        }

        root.innerHTML = `
            ${UI.renderTopBar(store)}
            ${UI.renderNavigation(this.currentView, role)}
            ${this.mobileMenuOpen ? UI.renderMobileDrawer(this.currentView, role) : ''}
            <main class="pb-16">${mainContent}</main>
            <div id="modal-container"></div>
            <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
        `;
    },

    navigate(view) {
        const role = store.currentUser ? store.currentUser.role_name : 'Cashier';
        const permissions = {
            'Admin': ['dashboard', 'pos', 'inventory', 'suppliers', 'payroll', 'losses', 'reports', 'accounts', 'logs', 'settings'],
            'Manager': ['dashboard', 'pos', 'inventory', 'suppliers', 'payroll', 'losses', 'reports'],
            'Cashier': ['dashboard', 'pos']
        };
        const allowed = permissions[role] || ['pos'];
        if (!allowed.includes(view)) {
            this.showToast(`Access Denied: Role "${role}" cannot access ${view}.`, 'error');
            return;
        }

        this.currentView = view;
        this.renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    toggleMobileMenu() {
        this.mobileMenuOpen = !this.mobileMenuOpen;
        this.renderApp();
    },

    closeMobileMenu() {
        this.mobileMenuOpen = false;
        this.renderApp();
    },

    switchReportTab(tab) {
        this.activeReportSubTab = tab;
        this.renderApp();
    },

    // 1. AUTHENTICATION & LOGIN
    renderLogin(errorMsg = '') {
        const root = document.getElementById('app-root');
        root.innerHTML = UI.renderLoginView(errorMsg);
    },

    handleLoginSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;

        const res = store.login(email, pass);
        if (!res.success) {
            this.renderLogin(res.message);
            return;
        }

        if (res.isTempPassword) {
            // First time login - prompt profile setup modal
            const root = document.getElementById('app-root');
            root.innerHTML = UI.renderLoginView() + UI.renderProfileSetupModal(res.user);
            return;
        }

        // Redirect based on role
        if (res.user.role_name === 'Admin' || res.user.role_name === 'Manager') {
            this.currentView = 'dashboard';
        } else {
            this.currentView = 'pos';
        }
        this.renderApp();
        this.showToast(`Welcome back, ${res.user.first_name}!`, 'success');
    },

    handleProfileSetupSubmit(e, userId) {
        e.preventDefault();
        const form = e.target;
        const payload = {
            first_name: form.first_name.value,
            middle_name: form.middle_name.value,
            last_name: form.last_name.value,
            phone_number: form.phone_number.value,
            address: form.address.value,
            email: form.email.value,
            password: form.password.value,
            confirm_password: form.confirm_password.value
        };

        const res = store.completeProfile(userId, payload);
        if (!res.success) {
            alert(res.message);
            return;
        }

        this.currentView = res.user.role_name === 'Admin' ? 'dashboard' : 'pos';
        this.renderApp();
        this.showToast('Profile completed and password secured successfully!', 'success');
    },

    fillLogin(email, pass) {
        const eInput = document.getElementById('login-email');
        const pInput = document.getElementById('login-password');
        if (eInput && pInput) {
            eInput.value = email;
            pInput.value = pass;
        }
    },

    togglePasswordVisibility(inputId, iconId) {
        const inp = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (!inp || !icon) return;
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    },

    logout() {
        store.logout();
        this.renderLogin();
    },

    // 2. POS CART & BARCODE
    handleBarcodeScan(barcode) {
        if (!barcode || !barcode.trim()) return;
        const res = store.addToCartByBarcode(barcode);
        if (res.success) {
            this.renderApp();
            this.showToast(res.message, 'success');
        } else {
            this.showToast(res.message, 'error');
        }
    },

    addToCart(productId) {
        const res = store.addToCart(productId);
        if (res.success) {
            this.renderApp();
            this.showToast(res.message, 'success');
        } else {
            this.showToast(res.message, 'error');
        }
    },

    updateCartQty(productId, qty) {
        store.updateCartItemQty(productId, qty);
        this.renderApp();
    },

    removeFromCart(productId) {
        store.removeFromCart(productId);
        this.renderApp();
    },

    clearCart() {
        store.clearCart();
        this.renderApp();
        this.showToast('Cart cleared.', 'info');
    },

    setTaxRate(val) {
        store.activeTaxRate = parseFloat(val) || 0;
        this.renderApp();
    },

    // 3. DISCOUNT & CHECKOUT
    applyDiscountSubmit(e) {
        e.preventDefault();
        const type = document.getElementById('discount-type-select').value;
        const idNum = document.getElementById('discount-id-number') ? document.getElementById('discount-id-number').value.trim() : '';
        const name = document.getElementById('discount-customer-name') ? document.getElementById('discount-customer-name').value.trim() : '';

        if (type !== 'None' && (!idNum || !name)) {
            alert('Please provide the Senior/PWD ID Number and Customer Name for official audit records.');
            return;
        }

        store.activeDiscountType = type;
        store.discountIdNumber = idNum;
        store.discountCustomerName = name;

        this.closeModal('discount-modal');
        this.renderApp();
        this.showToast(`Applied ${type} discount.`, 'success');
    },

    handleDiscountTypeChange(val) {
        const group = document.getElementById('discount-id-group');
        if (!group) return;
        if (val === 'None') {
            group.classList.add('hidden');
        } else {
            group.classList.remove('hidden');
        }
    },

    openCheckoutModal() {
        const container = document.getElementById('modal-container');
        if (!container) return;
        container.innerHTML = POS_UI.renderCheckoutModal(store);
        this.setPaymentMethodTab('Cash');
    },

    setPaymentMethodTab(method) {
        this.activePaymentMethod = method;
        ['Cash', 'GCash', 'Maya', 'MariBank'].forEach(m => {
            const btn = document.getElementById('tab-btn-' + m);
            if (btn) {
                if (m === method) {
                    btn.className = 'flex-1 py-2 rounded-lg bg-white text-emerald-700 shadow-sm transition';
                } else {
                    btn.className = 'flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition';
                }
            }
        });

        const cashView = document.getElementById('payment-view-Cash');
        const cashlessView = document.getElementById('payment-view-Cashless');

        if (method === 'Cash') {
            if (cashView) cashView.classList.remove('hidden');
            if (cashlessView) cashlessView.classList.add('hidden');
            setTimeout(() => {
                const inp = document.getElementById('cash-tendered-input');
                if (inp) { inp.focus(); inp.select(); }
            }, 50);
        } else {
            if (cashView) cashView.classList.add('hidden');
            if (cashlessView) cashlessView.classList.remove('hidden');

            const nameEl = document.getElementById('cashless-provider-name');
            const acctEl = document.getElementById('cashless-acct-no');

            if (nameEl) nameEl.textContent = `${method} Official Merchant QR`;
            if (acctEl) {
                if (method === 'Maya') acctEl.textContent = store.data.settings.maya_number || '0917 882 1904';
                else if (method === 'MariBank') acctEl.textContent = store.data.settings.maribank_number || '1092 8472 9182';
                else acctEl.textContent = store.data.settings.gcash_number || '0917 882 1904';
            }
            setTimeout(() => {
                const inp = document.getElementById('cashless-ref-input');
                if (inp) { inp.focus(); }
            }, 50);
        }
    },

    setExactCash(total) {
        const inp = document.getElementById('cash-tendered-input');
        if (inp) {
            inp.value = total.toFixed(2);
            this.recalculateCashChange(total);
        }
    },

    setCashAmount(amt, total) {
        const inp = document.getElementById('cash-tendered-input');
        if (inp) {
            inp.value = amt.toFixed(2);
            this.recalculateCashChange(total);
        }
    },

    recalculateCashChange(total) {
        const inp = document.getElementById('cash-tendered-input');
        const display = document.getElementById('cash-change-display');
        if (!inp || !display) return;
        const tendered = parseFloat(inp.value) || 0;
        const change = tendered - total;
        if (change < 0) {
            display.textContent = `Under by ₱${Math.abs(change).toFixed(2)}`;
            display.className = 'text-base font-bold text-red-600';
        } else {
            display.textContent = `₱${change.toFixed(2)}`;
            display.className = 'text-xl font-black text-emerald-700';
        }
    },

    submitCheckoutPayment() {
        const method = this.activePaymentMethod;
        const totals = store.calculateCartTotals();
        let tendered = totals.totalAmount;
        let refNo = '';

        if (method === 'Cash') {
            const inp = document.getElementById('cash-tendered-input');
            tendered = parseFloat(inp ? inp.value : totals.totalAmount);
            if (isNaN(tendered) || tendered < totals.totalAmount) {
                alert('Tendered cash is less than the total amount due.');
                return;
            }
        } else {
            const refInp = document.getElementById('cashless-ref-input');
            refNo = refInp ? refInp.value.trim() : '';
            if (!refNo) {
                alert(`Please enter the ${method} payment reference / trace number.`);
                return;
            }
            tendered = totals.totalAmount;
        }

        const res = store.processCheckout(method, tendered, refNo);
        if (!res.success) {
            alert(res.message);
            return;
        }

        // Show receipt modal
        this.closeModal('checkout-modal');
        this.renderApp();
        const container = document.getElementById('modal-container');
        if (container) {
            container.innerHTML = POS_UI.renderReceiptModal(res.transaction, store);
        }
        this.showToast('Transaction completed successfully!', 'success');
    },

        if (container) {
            container.innerHTML = POS_UI.renderReceiptModal(tx, store);
        }

                    </div>

    handleVoidTransactionSubmit(e, txId) {
        e.preventDefault();
        const sel = document.getElementById('void-reason-select');
        const custom = document.getElementById('void-reason-custom');

        this.renderApp();

    // 7. SETTINGS & SYNC ACTIONS
    async testSupabaseConnection() {
        this.showToast('Pinging Supabase REST API...', 'info');
        const online = await store.checkSupabaseConnection();
        this.renderApp();
        if (online) {
            this.showToast('Supabase Cloud Database connected and healthy!', 'success');
        } else {
            if (store.syncStatus.includes('Schema Pending')) {
                this.showToast('Supabase cloud reached! Please run the SQL schema in Supabase to create the tables.', 'warning');
                this.openSqlSchemaModal();
            } else {
                this.showToast(`Supabase status: ${store.syncStatus}`, 'warning');
            }
        }
    },

    async syncToSupabase() {
        this.showToast('Checking Supabase connection & tables...', 'info');
        const res = await store.syncToSupabase();
        this.renderApp();
        if (res.success) {
            this.showToast(res.message, 'success');
        } else {
            if (res.isSchemaPending || (res.message && res.message.includes('tables not found'))) {
                this.showToast('Supabase reached, but database tables are not yet created!', 'warning');
                this.openSqlSchemaModal();
            } else {
                this.showToast(res.message, 'error');
            }
        }
    },

    copySqlSchemaToClipboard() {
        const sql = window.SUPABASE_SCHEMA_SQL || '';
        if (!sql) {
            this.showToast('SQL schema file not loaded.', 'error');
            return;
        }
        navigator.clipboard.writeText(sql).then(() => {
            this.showToast('SQL Schema copied to clipboard! Paste it into Supabase SQL editor & click Run.', 'success');
        }).catch(() => {
            this.openSqlSchemaModal();
        });
    },

    // Filter Helpers
    filterPOSProducts(keyword) {
        const grid = document.getElementById('pos-products-grid');
        if (!grid) return;
        const q = keyword.toLowerCase().trim();
        Array.from(grid.children).forEach(card => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(q) ? '' : 'none';
        });
    },

    filterPOSCategory(category) {
        document.querySelectorAll('.pos-cat-btn').forEach(btn => {
            if (btn.getAttribute('data-cat') === category) {
                btn.className = 'pos-cat-btn px-2.5 py-1 rounded-full font-bold bg-emerald-600 text-white border border-emerald-600';
            } else {
                btn.className = 'pos-cat-btn px-2.5 py-1 rounded-full font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200';
            }
        });

        const grid = document.getElementById('pos-products-grid');
        if (!grid) return;
        Array.from(grid.children).forEach(card => {
            if (category === 'all') {
                card.style.display = '';
            } else {
                card.style.display = card.textContent.includes(category) ? '' : 'none';
            }
        });
    },

    filterInventoryTable(keyword) {
        const body = document.getElementById('inventory-table-body');
        if (!body) return;
        const q = keyword.toLowerCase().trim();
        Array.from(body.children).forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    },

    filterInventoryCategory(category) {
        const body = document.getElementById('inventory-table-body');
        if (!body) return;
        Array.from(body.children).forEach(row => {
            const rowCat = row.getAttribute('data-cat');
            if (category === 'all' || rowCat === category) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    },

    filterInventoryStock(type) {
        const body = document.getElementById('inventory-table-body');
        if (!body) return;
        Array.from(body.children).forEach(row => {
            const stock = parseFloat(row.getAttribute('data-stock'));
            const threshold = parseFloat(row.getAttribute('data-threshold'));
            if (type === 'all') {
                row.style.display = '';
            } else if (type === 'low') {
                row.style.display = stock <= threshold ? '' : 'none';
            } else if (type === 'instock') {
                row.style.display = stock > threshold ? '' : 'none';
            }
        });
    },

    filterReportsPeriod(period) {
        this.reportFilter = period;
        this.renderApp();
    },
