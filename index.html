                                <input type="number" step="any" name="sss_deduction" value="400" class="w-full p-1.5 border rounded bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-600 mb-0.5">PhilHealth (₱)</label>
                                <input type="number" step="any" name="philhealth_deduction" value="180" class="w-full p-1.5 border rounded bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Pag-IBIG (₱)</label>
                                <input type="number" step="any" name="pagibig_deduction" value="100" class="w-full p-1.5 border rounded bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-600 mb-0.5">Other / Adv (₱)</label>
                                <input type="number" step="any" name="other_deductions" value="0" class="w-full p-1.5 border rounded bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- Net Pay Banner -->
                    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between">
                        <span class="font-bold text-emerald-900">Total Net Take-Home Pay:</span>
                        <span id="payroll-net-display" class="font-black text-emerald-700 text-lg">₱6,263.75</span>
                    </div>

                    <div class="pt-3 border-t flex space-x-2">
                        <button type="button" onclick="app.closeModal('payroll-calc-modal')" class="w-1/3 py-2 bg-slate-100 font-bold rounded-lg">Cancel</button>
                        <button type="submit" class="w-2/3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow">Save Payroll Entry</button>
                    </div>
                </form>
            </div>
        </div>`;
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = html;
        this.recalcPayrollModal(document.getElementById('payroll-form'));
    },

    recalcPayrollModal(form) {
        if (!form) return;
        const res = store.calculatePayrollValues(
            form.daily_rate.value,
            form.days_worked.value,
            form.overtime_hours.value,
            form.sss_deduction.value,
            form.philhealth_deduction.value,
            form.pagibig_deduction.value,
            form.other_deductions.value
        );
        const grossEl = document.getElementById('payroll-gross-display');
        const netEl = document.getElementById('payroll-net-display');
        if (grossEl) grossEl.textContent = `₱${res.grossPay.toFixed(2)}`;
        if (netEl) netEl.textContent = `₱${res.netPay.toFixed(2)}`;
    },

    handlePayrollSubmit(e) {
        e.preventDefault();
        const f = e.target;
        const payload = {
            name: f.name.value,
            role: f.role.value,
            daily_rate: f.daily_rate.value,
            days_worked: f.days_worked.value,
            overtime_hours: f.overtime_hours.value,
            sss_deduction: f.sss_deduction.value,
            philhealth_deduction: f.philhealth_deduction.value,
            pagibig_deduction: f.pagibig_deduction.value,
            other_deductions: f.other_deductions.value
        };
        store.addOrUpdateEmployee(payload);
        this.closeModal('payroll-calc-modal');
        this.renderApp();
        this.showToast('Employee payroll record processed successfully!', 'success');
    },

    openLogLossModal() {
        const products = store.data.products;
        const html = `
        <div id="log-loss-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 animate-fade-in border border-slate-100">
                <div class="flex items-center justify-between pb-3 border-b mb-4">
                    <h3 class="text-base font-black text-slate-900">Log Spoilage or Damaged Rice</h3>
                    <button onclick="app.closeModal('log-loss-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form onsubmit="app.handleLogLossSubmit(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Select Rice Product *</label>
                        <select name="product_id" required class="w-full p-2 border rounded-lg font-bold">
                            ${products.map(p => `<option value="${p.id}">${p.name} (${p.stock_quantity} ${p.unit} in stock)</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Spoiled / Damaged Qty *</label>
                            <input type="number" step="any" min="1" name="quantity" required placeholder="1" class="w-full p-2 border rounded-lg font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Reason / Nature *</label>
                            <select name="reason" class="w-full p-2 border rounded-lg font-semibold">
                                <option value="Damaged Sack">Damaged Sack</option>
                                <option value="Pest/Weevil Infestation">Pest/Weevil Infestation</option>
                                <option value="Moisture Spoilage">Moisture Spoilage</option>
                                <option value="Spillage">Spillage</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Incident Notes</label>
                        <textarea name="notes" rows="2" placeholder="e.g. Unloading tear, wet pallet" class="w-full p-2 border rounded-lg"></textarea>
                    </div>
                    <div class="pt-3 border-t flex space-x-2">
                        <button type="button" onclick="app.closeModal('log-loss-modal')" class="w-1/3 py-2 bg-slate-100 font-bold rounded-lg">Cancel</button>
                        <button type="submit" class="w-2/3 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow">Log & Deduct Inventory</button>
                    </div>
                </form>
            </div>
        </div>`;
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = html;
    },

    handleLogLossSubmit(e) {
        e.preventDefault();
        const f = e.target;
        const res = store.logLoss(parseInt(f.product_id.value), f.quantity.value, f.reason.value, f.notes.value);
        if (!res.success) {
            alert(res.message);
            return;
        }
        this.closeModal('log-loss-modal');
        this.renderApp();
        this.showToast('Spoilage recorded and stock updated.', 'warning');
    },

    closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.remove();
    },

    closeAllModals() {
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = '';
    },

    // Toast Notification System
    showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-700 text-white' :
                   type === 'error' ? 'bg-red-700 text-white' :
                   type === 'warning' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-white';

        toast.className = `px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg flex items-center space-x-2 animate-fade-in ${bg}`;
        toast.innerHTML = `
            <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-info'}"></i>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3200);
    }
};

// Start application when DOM loads
document.addEventListener('DOMContentLoaded', () => {
    app.init();
});

    </script>
</body>
</html>
